version: '3.3' # Specify the Compose file version

services:

  db:
    image: postgres:12.22-alpine3.21
    container_name: database
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data # Volume pour persister les données
      - ./init-scripts:/docker-entrypoint-initdb.d

    ports:
      - "5500:5432"
  backend:
    image: "gfriedtod/guolo_api:latest"
    container_name: guolo_api
    ports:
      - "8086:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=postgres
    restart: always
    depends_on:
      - db

volumes:
  postgres_data: # Déclare le volume pour PostgreSQL
  init-scripts:
