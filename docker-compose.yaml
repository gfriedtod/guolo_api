version: '3.3' # Specify the Compose file version

services:

  rabbit-server:
    image: rabbitmq:3-management
    container_name: rabbitmqPaypro
    ports:
      - 5672:5672
      - 61613:15674

  db:
    image: postgres:12.22-alpine3.21
    container_name: database
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data # Volume pour persister les données
      - ./init-scripts:/docker-entrypoint-initdb.d

    ports:
      - "5500:5432"
  backend:
    image: "gfriedtod/guolo_api:latest"
    container_name: guolo_api
    ports:
      - "8086:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=postgres
      - RABBIT_HOST=rabbit-server
      - RABBIT_PORT=5672
      - RABBIT_USER=guest
      - RABBIT_PASSWORD=guest
    restart: always
    depends_on:
      - db
  frontend:
    image: "gfriedtod/guolo_admin:latest"
    container_name: guolo_admin
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=${VITE_API_URL}
      - VITE_WS_URL=${VITE_API_URL}
    depends_on:
      - backend

volumes:
  postgres_data: # Déclarer le volume pour PostgreSQL
  init-scripts:
